# Lokal geliştirme: sadece Postgres (Next.js host'ta npm run dev)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eserpromo
      POSTGRES_PASSWORD: eserpromo
      POSTGRES_DB: eserpromo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eserpromo -d eserpromo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
